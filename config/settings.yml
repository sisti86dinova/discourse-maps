plugins:
  # --------------------------------------------------------------------------
  #  General settings for the Discourse Maps plugin.
  #  Configurable from: Admin > Settings > Plugins.
  # --------------------------------------------------------------------------

  # Enables or disables the whole plugin.
  discourse_maps_enabled:
    default: true
    client: true

  # ID of the "map" tag automatically assigned to topics that use the plugin.
  # Per spec, the default value is 295.
  discourse_maps_map_tag_id:
    default: 295
    client: true

  # Groups (besides administrators, who always see it) allowed to see the
  # "New topic" button on the /map page. Empty = admins only.
  discourse_maps_new_topic_groups:
    client: true
    type: group_list
    list_type: compact
    default: ""
    allow_any: false

  # Background color of the "cluster" pin (the numbered circle that indicates
  # multiple overlapping topics at the same point on the map).
  discourse_maps_cluster_color:
    client: true
    type: color
    default: "0088CC"

  # --------------------------------------------------------------------------
  #  Map and geocoding provider.
  #  The plugin supports two interchangeable providers:
  #   - "locationiq" : OpenStreetMap tiles + geocoding via LocationIQ
  #   - "google"     : Google Maps JavaScript API + Google Geocoding
  # --------------------------------------------------------------------------
  discourse_maps_provider:
    type: enum
    default: "locationiq"
    client: true
    choices:
      - "locationiq"
      - "google"

  # LocationIQ API key (used when the provider is "locationiq").
  # Needed both client-side (tiles) and server-side (geocoding), hence
  # it's exposed to the client. LocationIQ allows restricting the key by domain.
  discourse_maps_locationiq_api_key:
    default: ""
    client: true

  # Google Maps API key (used when the provider is "google").
  # Needed client-side to load the Maps JavaScript API.
  # Google allows restricting the key by referrer/domain.
  discourse_maps_google_api_key:
    default: ""
    client: true

